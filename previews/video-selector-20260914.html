<body>
<main class="review">
<header class="review-top"><img class="logo" src="../assets/brand/60base-original02-01-horizontal-web.svg" alt="60BASE"><span class="preview-badge" id="preview-badge">DESIGN OPTIONS · 2026.09.14</span><button class="locale" id="locale" type="button" aria-label="영문 시안 보기"><b>KR</b> / EN</button></header>
<h1 id="review-title">썸네일 크기를 유지하는 세 가지 탐색 방식</h1>
<p class="intro" id="review-intro">시안을 바꾼 뒤, 화살표·태그·썸네일을 직접 눌러 비교해 보세요.</p>
<nav class="options" role="tablist" aria-label="영상 탐색 시안">
<button class="option" id="tab-a" type="button" role="tab" aria-selected="true" aria-controls="review-panel" data-variant="a"><span class="option-num">01</span><span><span class="option-title">세로 슬라이드</span><span class="option-caption">기존 배치 유지 · 추천</span></span></button>
<button class="option" id="tab-b" type="button" role="tab" aria-selected="false" aria-controls="review-panel" tabindex="-1" data-variant="b"><span class="option-num">02</span><span><span class="option-title">태그 필터</span><span class="option-caption">작업 종류로 좁혀 보기</span></span></button>
<button class="option" id="tab-c" type="button" role="tab" aria-selected="false" aria-controls="review-panel" tabindex="-1" data-variant="c"><span class="option-num">03</span><span><span class="option-title">하단 가로 슬라이드</span><span class="option-caption">영상 아래에서 좌우 탐색</span></span></button>
</nav>
<section class="review-panel" id="review-panel" role="tabpanel" aria-labelledby="tab-a">
<div class="panel-heading"><div><h2 id="option-heading">01 · 세로 슬라이드</h2><p id="option-summary">원래 크기의 썸네일 3개를 유지하고, 다음 묶음으로 넘깁니다.</p></div><span class="recommend" id="recommend">추천</span></div>
<div class="stage side-layout" data-variant="a" id="stage">
<div class="media-heading"><strong>HUMAN ACTION DATA</strong><span id="example-caption">촬영 예시 · 6개</span></div>
<div class="layout">
<div class="player"><video id="video" controls muted playsinline preload="none" src="../assets/videos/collection/cutting-vegetables.mp4" poster="../assets/videos/collection/cutting-vegetables.jpg" aria-label="채소 손질 촬영 예시"></video><div class="facts"><span id="environment">주방</span><span id="viewpoint">1인칭 시점</span></div><div class="video-label"><strong id="video-name">채소 손질</strong><span id="video-action">채소 손질하고 자르기</span></div></div>
<aside class="sidebar" aria-label="촬영 예시 탐색"><div class="filters" id="filters" aria-label="작업 종류" hidden></div><div class="viewport" id="viewport"><div class="gallery" id="gallery" role="group" aria-label="촬영 영상 선택"></div></div><div class="pager"><span class="range" id="range" role="status" aria-live="polite"></span><div class="arrows"><button class="arrow" id="previous" type="button" aria-label="이전 영상 3개"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><button class="arrow" id="next" type="button" aria-label="다음 영상 3개"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div></div></aside>
</div><p class="error" id="error" role="status" hidden></p>
</div>
</section>
<p class="footer-note" id="footer-note">데스크톱 썸네일은 기존 190px 기준입니다. 실제 영상 6개로 작동하며, 공개 홈페이지에는 아직 적용하지 않은 비교용 시안입니다.</p>
</main>
<script>
const samples=[
 {id:'cutting-vegetables',ko:'채소 손질',en:'Cutting vegetables',group:'kitchen',environment:['주방','Kitchen'],action:['채소 손질하고 자르기','Preparing and cutting vegetables']},
 {id:'dishwashing',ko:'설거지',en:'Washing dishes',group:'kitchen',environment:['주방','Kitchen'],action:['식기 씻고 정리하기','Washing and arranging dishes']},
 {id:'folding-clothes',ko:'빨래 개기',en:'Folding clothes',group:'laundry',environment:['생활 공간','Living space'],action:['옷 접고 정리하기','Folding and arranging clothes']},
 {id:'vacuuming',ko:'바닥 청소',en:'Vacuuming',group:'cleaning',environment:['거실','Living room'],action:['무선 청소기로 바닥 청소','Vacuuming the floor']},
 {id:'folding-towels',ko:'수건 접기',en:'Folding towels',group:'laundry',environment:['거실','Living room'],action:['수건 접고 정리하기','Folding and arranging towels']},
 {id:'dishwashing-2',ko:'식기 헹구기',en:'Rinsing dishes',group:'kitchen',environment:['주방','Kitchen'],action:['흐르는 물에 식기 헹구기','Rinsing dishes under running water']}
];
const variants={
 a:{title:['세로 슬라이드','Vertical slider'],caption:['기존 배치 유지 · 추천','Original layout · Recommended'],summary:['원래 크기의 썸네일 3개를 유지하고, 다음 묶음으로 넘깁니다.','Keep three thumbnails at their original size, then move to the next group.']},
 b:{title:['태그 필터','Category filters'],caption:['작업 종류로 좁혀 보기','Browse by type of task'],summary:['주방·세탁·청소 태그로 좁혀 봅니다. 필터를 바꿔도 재생 중인 영상은 유지됩니다.','Narrow the list by task. Filtering keeps the current video playing.']},
 c:{title:['하단 가로 슬라이드','Horizontal filmstrip'],caption:['영상 아래에서 좌우 탐색','Browse below the video'],summary:['영상과 썸네일 크기를 유지하며 아래에서 좌우로 넘깁니다. 화면의 세로 길이는 조금 늘어납니다.','Keep the player and thumbnails the same size, with a sliding strip below. This uses more vertical space.']}
};
const groups={all:['전체','All'],kitchen:['주방','Kitchen'],laundry:['세탁·정리','Laundry'],cleaning:['청소','Cleaning']};
let variant='a',language='ko',pageIndex=0,filter='all',selected=samples[0].id;
const byId=id=>document.getElementById(id),video=byId('video'),pageSize=3;
const english=()=>language==='en',t=pair=>pair[english()?1:0];
const activeSamples=()=>samples.filter(sample=>filter==='all'||sample.group===filter);
function renderGallery(direction=0){
 const list=activeSamples(),pages=Math.max(1,Math.ceil(list.length/pageSize));pageIndex=Math.max(0,Math.min(pageIndex,pages-1));
 const shown=list.slice(pageIndex*pageSize,(pageIndex+1)*pageSize);
 byId('gallery').replaceChildren(...shown.map(sample=>{
  const button=document.createElement('button');button.type='button';button.className='sample';button.dataset.sample=sample.id;button.setAttribute('aria-pressed',String(sample.id===selected));button.setAttribute('aria-controls','video');button.setAttribute('aria-label',sample[language]);
  const thumb=document.createElement("span");thumb.className="thumb";const image=document.createElement("img");image.src=`../assets/videos/collection/${sample.id}.jpg`;image.alt="";image.width=320;image.height=180;const duration=document.createElement("span");duration.className="duration";duration.setAttribute("aria-hidden","true");duration.textContent="00:20";thumb.append(image,duration);const name=document.createElement("span");name.className="name";button.append(thumb,name);
  button.querySelector('.name').textContent=sample[language];button.addEventListener('click',()=>chooseSample(sample));return button;
 }));
 byId('range').textContent=`${pageIndex*pageSize+1}–${Math.min((pageIndex+1)*pageSize,list.length)} / ${list.length}`;
 byId('previous').disabled=pageIndex===0;byId('next').disabled=pageIndex===pages-1;
 byId('previous').setAttribute('aria-label',t(['이전 영상 3개','Previous three videos']));byId('next').setAttribute('aria-label',t(['다음 영상 3개','Next three videos']));
 if(direction&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const horizontal=variant==='c'||innerWidth<=760;byId('gallery').animate([{opacity:.45,transform:`translate${horizontal?'X':'Y'}(${direction*12}px)`},{opacity:1,transform:'translate(0)'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'});}
}
function updateVideoLabels(){const sample=samples.find(sample=>sample.id===selected);byId('video-name').textContent=sample[language];byId('environment').textContent=t(sample.environment);byId('video-action').textContent=t(sample.action);byId('viewpoint').textContent=t(['1인칭 시점','First-person view']);video.setAttribute('aria-label',sample[language]);}
function chooseSample(sample){selected=sample.id;video.pause();video.poster=`../assets/videos/collection/${selected}.jpg`;video.src=`../assets/videos/collection/${selected}.mp4`;byId('error').hidden=true;updateVideoLabels();byId('gallery').querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.sample===selected)));video.play().catch(()=>{});}
function renderFilters(){byId('filters').hidden=variant!=='b';byId('filters').replaceChildren(...Object.entries(groups).map(([id,names])=>{const button=document.createElement('button');button.type='button';button.className='filter';button.dataset.filter=id;button.setAttribute('aria-pressed',String(id===filter));const count=id==='all'?samples.length:samples.filter(sample=>sample.group===id).length;button.append(document.createTextNode(t(names)));const badge=document.createElement('em');badge.textContent=count;button.append(badge);button.addEventListener('click',()=>{filter=id;pageIndex=0;renderFilters();renderGallery();byId("filters").querySelector(`[data-filter="${id}"]`).focus({preventScroll:true});});return button;}));}
function render(){
 document.documentElement.lang=language;document.querySelector('[role=tablist]').setAttribute('aria-label',t(['영상 탐색 시안','Video navigation options']));document.querySelector('.sidebar').setAttribute('aria-label',t(['촬영 예시 탐색','Browse filming examples']));byId('filters').setAttribute('aria-label',t(['작업 종류','Task categories']));byId('gallery').setAttribute('aria-label',t(['촬영 영상 선택','Select a filming example']));
 byId('review-title').textContent=t(['썸네일 크기를 유지하는 세 가지 탐색 방식','Three ways to browse without shrinking thumbnails']);
 byId('review-intro').textContent=t(['시안을 바꾼 뒤, 화살표·태그·썸네일을 직접 눌러 비교해 보세요.','Try each option, then use its arrows, filters and thumbnails.']);
 byId('locale').innerHTML=english()?'KR / <b>EN</b>':'<b>KR</b> / EN';byId('locale').setAttribute('aria-label',t(['영문 시안 보기','View Korean options']));
 document.querySelectorAll('[role="tab"]').forEach((button,index)=>{const id=button.dataset.variant;button.setAttribute('aria-selected',String(id===variant));button.tabIndex=id===variant?0:-1;button.querySelector('.option-title').textContent=t(variants[id].title);button.querySelector('.option-caption').textContent=t(variants[id].caption);});
 byId('review-panel').setAttribute('aria-labelledby',`tab-${variant}`);byId('option-heading').textContent=`0${Object.keys(variants).indexOf(variant)+1} · ${t(variants[variant].title)}`;byId('option-summary').textContent=t(variants[variant].summary);byId('recommend').hidden=variant!=='a';byId('recommend').textContent=t(['추천','Recommended']);
 byId('stage').dataset.variant=variant;byId('stage').classList.toggle('side-layout',variant!=='c');byId('example-caption').textContent=t(['촬영 예시 · 6개','Filming examples · 6']);
 byId('footer-note').textContent=t(['데스크톱 썸네일은 기존 190px 기준입니다. 실제 영상 6개로 작동하며, 공개 홈페이지에는 아직 적용하지 않은 비교용 시안입니다.','Desktop thumbnails retain the original 190px scale. These working options use all six real clips and have not been applied to the public homepage.']);
 renderFilters();renderGallery();updateVideoLabels();
}
function selectVariant(id){variant=id;filter='all';pageIndex=Math.floor(samples.findIndex(sample=>sample.id===selected)/pageSize);render();const url=new URL(location.href);url.searchParams.set('option',id);history.replaceState(null,'',url);}
document.querySelectorAll('[role="tab"]').forEach(button=>{button.addEventListener('click',()=>selectVariant(button.dataset.variant));button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const ids=Object.keys(variants);let index=ids.indexOf(button.dataset.variant);index=event.key==='Home'?0:event.key==='End'?2:(index+(event.key==='ArrowRight'?1:-1)+3)%3;selectVariant(ids[index]);byId(`tab-${ids[index]}`).focus();});});
byId('previous').addEventListener('click',()=>{pageIndex--;renderGallery(-1)});byId('next').addEventListener('click',()=>{pageIndex++;renderGallery(1)});
byId('locale').addEventListener('click',()=>{language=english()?'ko':'en';render();});
video.addEventListener('error',()=>{byId('error').textContent=t(['영상을 불러오지 못했습니다. 다른 영상을 선택하거나 다시 재생해 주세요.','The video could not load. Select another clip or try playing again.']);byId('error').hidden=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause()});
let touchStart=null;byId('viewport').addEventListener('touchstart',event=>{touchStart={x:event.touches[0].clientX,y:event.touches[0].clientY}},{passive:true});byId('viewport').addEventListener('touchend',event=>{if(!touchStart)return;const dx=event.changedTouches[0].clientX-touchStart.x,dy=event.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){const button=byId(dx<0?'next':'previous');if(!button.disabled)button.click();}},{passive:true});
const initial=new URL(location.href).searchParams.get('option');if(variants[initial])variant=initial;render();
</script>
</body>
</html>
