<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="에고">
  <meta name="description" content="내 시점이 AI가 된다. 에고(EGO)에서 일상을 촬영하고, 제출한 영상의 심사 결과와 포인트를 확인하세요.">
  <title>에고 EGO · 촬영 참여 앱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/symbol.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../studio/online.css">
  <link rel="stylesheet" href="../studio/camera.css">
  <link rel="preload" href="../fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="launch.css">
  <link rel="stylesheet" href="preparation.css">
  <link rel="stylesheet" href="device-settings.css" id="app-device-settings-css">
  <link rel="stylesheet" href="ego-experience.css">
  <link rel="stylesheet" href="ego-forms.css">
  <link rel="stylesheet" href="welcome-popup.css">
  <script type="module" src="launch.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app-main">본문으로 이동</a>
  <div class="app-shell" id="app-shell">
    <section class="app-launch" id="app-launch" hidden aria-label="에고 시작 화면">
      <div class="app-launch-brand" aria-label="에고 EGO"><img src="icons/symbol.svg" width="34" height="36" alt=""><span>ego</span></div>
      <div class="app-launch-stage" aria-hidden="true">
        <img class="app-launch-slide" src="../assets/videos/collection/dishwashing.jpg" width="640" height="360" alt="">
        <img class="app-launch-slide" src="../assets/videos/collection/folding-clothes.jpg" width="640" height="360" alt="">
        <img class="app-launch-slide" src="../assets/videos/collection/cutting-vegetables.jpg" width="640" height="360" alt="">
      </div>
      <div class="app-launch-copy"><h1>내 시점이<br>AI가 된다.</h1><p>에고 · EGO BY 60BASE</p></div>
      <div class="app-launch-footer">
        <p class="app-launch-status" role="status"><img class="app-loading-symbol" src="icons/symbol.svg" width="36" height="36" alt=""><span>일상을 불러오고 있어요.</span></p>
        <button class="app-launch-continue" type="button">바로 시작하기</button>
      </div>
    </section>
    <div class="app-connection" id="app-connection" role="status" hidden></div>
    <header class="app-header" id="app-header"></header>
    <main id="app-main" tabindex="-1"><section class="app-loading" role="status" aria-live="polite"><img class="app-loading-symbol" src="icons/symbol.svg" alt="" width="112" height="112"><h1>에고 EGO</h1><p>일상을 불러오고 있어요.</p></section></main>
    <nav class="app-bottom-nav" aria-label="앱 메뉴" hidden></nav>
    <div class="app-progress" id="app-progress" role="status" aria-live="polite" hidden><img class="app-loading-symbol" src="icons/symbol.svg" alt="" width="28" height="28"><span data-progress-message></span></div>
    <p class="app-toast" id="app-toast" role="status" hidden></p>
    <noscript><style>.app-launch{display:none}</style><p class="app-noscript">촬영과 내 기록을 이용하려면 JavaScript를 켜주세요.</p></noscript>
  </div>
</body>
</html>
